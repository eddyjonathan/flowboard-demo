flowboard_dbt:
  target: neon
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5433
      user: postgres
      password: "{{ env_var('DEV_DB_PASSWORD', '') }}"
      dbname: flowboard
      schema: dbt_dev
      threads: 4
    neon:
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      port: 5432
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      dbname: "{{ env_var('NEON_DBNAME') }}"
      schema: dbt_dev
      threads: 4
      sslmode: require